[project]
name = "saarthi"
version = "0.1.0"
description = "Voice-first personal AI agent on Bolna"
readme = "README.md"
authors = [
    { name = "savarbhasin", email = "savarbhasin446@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "croniter>=6.2.4",
    "docker>=7.2.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.41",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "supermemory>=5.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
saarthi-sync = "saarthi.voice.sync:main"
saarthi-call = "saarthi.voice.call:main"
saarthi-scheduler = "saarthi.scheduler:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
